name: Build and regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.19.4", "1.20.1", "1.21.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build, run regression programs, and collect jars
        run: bash gradlew --no-daemon --stacktrace :${{ matrix.minecraft }}:buildAndCollect
      - uses: actions/upload-artifact@v4
        with:
          name: kuradialmenu-${{ matrix.minecraft }}
          path: build/libs/**/*.jar
          if-no-files-found: error
      - name: Retain build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/
          if-no-files-found: ignore
